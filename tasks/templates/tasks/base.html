<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %}TaskFlow{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            background: #f5f5f5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-add {
            background: #4CAF50;
            color: white;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
